name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: shellcheck the composite steps
        run: |
          set -euo pipefail
          # Every run: block of every action, with the expressions replaced by a plain word.
          for f in */action.yml; do
            yq -r '.runs.steps[] | select(.run) | .run' "$f" | sed -E 's/\$\{\{[^}]*\}\}/X/g' >"$RUNNER_TEMP/steps.sh"
            shellcheck --shell=bash --severity=warning "$RUNNER_TEMP/steps.sh"
          done

  # The build action end to end against a throwaway buildkitd and registry, the way a project's runner provides them.
  build:
    runs-on: ubuntu-24.04
    env:
      BUILDKIT_HOST: tcp://127.0.0.1:1234
      UMATIX_REGISTRY: localhost:5000/test
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Start buildkitd and a registry
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG" && echo '{}' >"$DOCKER_CONFIG/config.json"
          docker run -d --name buildkitd --privileged -p 127.0.0.1:1234:1234 moby/buildkit:v0.34.0 \
            --addr tcp://0.0.0.0:1234
          docker run -d --name registry -p 127.0.0.1:5000:5000 registry:3
          for _ in $(seq 30); do curl -fs http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
          for _ in $(seq 30); do docker exec buildkitd buildctl debug workers >/dev/null 2>&1 && break; sleep 1; done
      - name: Build, scan and push
        id: first
        uses: ./build
        with:
          component: greeting
          dockerfile: testdata/Dockerfile
          context: testdata
          build-args: GREETING=umatix
          push: "true"
      - name: A second push of the same tag keeps the first
        id: second
        uses: ./build
        with:
          component: greeting
          dockerfile: testdata/Dockerfile
          context: testdata
          build-args: GREETING=overwritten
          push: "true"
      - name: Check the outputs
        env:
          IMAGE: ${{ steps.first.outputs.image }}
          FIRST: ${{ steps.first.outputs.digest }}
          SECOND: ${{ steps.second.outputs.digest }}
          TAG: ${{ steps.first.outputs.tag }}
        run: |
          set -euo pipefail
          test "$IMAGE" = "localhost:5000/test/greeting:sha-$GITHUB_SHA"
          test "$TAG" = "sha-$GITHUB_SHA"
          test -n "$FIRST" && test "$FIRST" = "$SECOND"
          test "$(crane digest "$IMAGE")" = "$FIRST"
      - name: Outside a project's runner the action refuses
        id: refuse
        continue-on-error: true
        uses: ./build
        env:
          BUILDKIT_HOST: ""
        with:
          component: greeting
          dockerfile: testdata/Dockerfile
          context: testdata
      - name: It did refuse
        env:
          OUTCOME: ${{ steps.refuse.outcome }}
        run: test "$OUTCOME" = failure
      - name: A missing ignore file is an error, not an empty exception list
        id: missing-ignore
        continue-on-error: true
        uses: ./build
        with:
          component: greeting
          dockerfile: testdata/Dockerfile
          context: testdata
          ignore-file: testdata/no-such-ignore-file.yaml
      - name: It did fail
        env:
          OUTCOME: ${{ steps.missing-ignore.outcome }}
        run: test "$OUTCOME" = failure
